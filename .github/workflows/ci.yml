name: GravityBridge CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  gravitybridge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/gravitybridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
